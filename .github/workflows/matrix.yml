name: Matrix

# The support matrix behind the README: tests, coverage and build on each
# supported Node and Better Auth version, the adapter suite on Postgres, and a
# full sign-in on Bun, Deno and Cloudflare Workers.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matrix-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (node ${{ matrix.node }}, better-auth ${{ matrix.better-auth }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        better-auth: ["1.7.0", latest]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s
          --health-retries 15
    env:
      POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The lockfile is written by the npm in packageManager; Node's bundled npm may reject it.
      - run: npm install -g npm@11.6.2
      - run: npm ci
      # Swap in the whole Better Auth family at one version: every @better-auth/*
      # package locked at better-auth's version, plus core's peers that we depend
      # on too (better-call, @better-fetch/fetch, ...) where the locked version
      # is outside core's range.
      - name: Install better-auth ${{ matrix.better-auth }}
        env:
          BETTER_AUTH: ${{ matrix.better-auth }}
        run: |
          version=$(npm view "better-auth@$BETTER_AUTH" version)
          peers=$(npm view "@better-auth/core@$version" peerDependencies --json)
          list=$(PEERS="$peers" VERSION="$version" node -e '
            const { packages } = require("./package-lock.json");
            const { devDependencies, peerDependencies } = require("./package.json");
            const locked = packages["node_modules/better-auth"].version;
            const family = Object.keys(packages)
              .filter((p) => /^node_modules\/@better-auth\/[^/]+$/.test(p) && packages[p].version === locked)
              .map((p) => `${p.slice("node_modules/".length)}@${process.env.VERSION}`);
            const { satisfies } = require("semver");
            const own = { ...devDependencies, ...peerDependencies };
            const peers = Object.entries(JSON.parse(process.env.PEERS))
              .filter(([name, range]) => name in own && !satisfies(packages[`node_modules/${name}`].version, range))
              .map(([name, range]) => `${name}@${range}`);
            console.log([`better-auth@${process.env.VERSION}`, ...family, ...peers].join("\n"));
          ')
          mapfile -t specs <<< "$list"
          npm install --no-save "${specs[@]}"
          npm ls "${specs[@]%@*}" better-call @better-fetch/fetch @better-auth/utils
      - run: npm run coverage
      - run: npm run build

  smoke:
    name: smoke (${{ matrix.runtime }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, deno, workers]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run build
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - if: matrix.runtime == 'bun'
        run: bun smoke/cli.ts
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - if: matrix.runtime == 'deno'
        run: deno run --allow-env --allow-read smoke/cli.ts
      - if: matrix.runtime == 'workers'
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          npx --yes wrangler@4 dev --config smoke/wrangler.json --port 8787 > wrangler.log 2>&1 &
          for _ in $(seq 90); do
            if status=$(curl -s -o body.txt -w '%{http_code}' http://localhost:8787); then
              cat body.txt
              echo
              [ "$status" = 200 ] && exit 0
              break
            fi
            sleep 2
          done
          cat wrangler.log
          exit 1

  example:
    name: example (${{ matrix.example }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: nextjs
            serve: npm run build && npm start
            origin: http://localhost:3000
          - example: hono-workers
            serve: npm run dev
            origin: http://localhost:8787
    env:
      BETTER_AUTH_SECRET: only-for-ci-only-for-ci-only-for-ci
      WRANGLER_SEND_METRICS: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci && npm run build
        working-directory: .
      - run: npm ci
      - run: npm run typecheck
      - name: Sign in to the running example
        run: |
          (${{ matrix.serve }}) > server.log 2>&1 &
          for _ in $(seq 90); do
            if curl -sf -o /dev/null "${{ matrix.origin }}/api/auth/ok"; then
              npm run smoke && exit 0
              break
            fi
            sleep 2
          done
          cat server.log
          exit 1
