# Synced from the platform repo (templates/ts-lib). Change it there, then sync.
name: Release

# release-please keeps one release PR open (version bump + CHANGELOG.md), built from the
# conventional squash commits on main. Merging it tags vX.Y.Z on main and creates the
# GitHub release; the publish job then waits for approval in the "npm" environment and
# publishes with npm trusted publishing (OIDC, provenance, no token).
#
# Keep the file name: the npm trusted publisher entry is bound to release.yml.
# A manual run (workflow_dispatch) publishes nothing: it proves the trusted publisher
# entry with a dry run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.rp.outputs['release_created'] }}
      tag_name: ${{ steps.rp.outputs['tag_name'] }}
    steps:
      # The release PR is opened with GITHUB_TOKEN, so no checks run on it; merge it with
      # the admin bypass of the main ruleset.
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' ||
      needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
          fetch-depth: 0
      - name: Release commit is on main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # npm runs the OIDC token exchange before it skips the upload, so a dry run
      # proves the trusted publisher entry without publishing anything.
      - name: Verify trusted publishing
        if: github.event_name == 'workflow_dispatch'
        working-directory: .
        run: |
          npm publish --dry-run --loglevel verbose 2>&1 | tee "$RUNNER_TEMP/dry-run.log" || true
          if grep -q 'Successfully retrieved and set token' "$RUNNER_TEMP/dry-run.log"; then
            echo "Trusted publishing authenticated."
          else
            echo "::error::OIDC exchange did not return a token. Check the npm trusted publisher entry (repository, release.yml, environment npm)."
            grep -E 'oidc|requires you to be logged in' "$RUNNER_TEMP/dry-run.log" || true
            exit 1
          fi
      - name: Publish
        if: github.event_name == 'push'
        working-directory: .
        run: npm publish
